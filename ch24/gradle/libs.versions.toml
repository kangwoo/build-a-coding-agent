[versions]
jackson       = "2.18.2"
junit         = "5.11.3"
junitPlatform = "1.11.3"   # junit 5.11.3 ↔ platform 1.11.3
assertj       = "3.26.3"
jline         = "3.27.1"
picocli       = "4.7.6"
wiremock      = "3.9.2"     # 5장 — 가짜 LLM 응답 서버
snakeyaml     = "2.3"       # 22장 — SKILL.md frontmatter 파싱

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310   = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-jdk8     = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
java-diff-utils  = { module = "io.github.java-diff-utils:java-diff-utils", version = "4.12" }
junit-jupiter    = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
assertj-core     = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jline            = { module = "org.jline:jline", version.ref = "jline" }
picocli          = { module = "info.picocli:picocli", version.ref = "picocli" }
wiremock         = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
snakeyaml        = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
